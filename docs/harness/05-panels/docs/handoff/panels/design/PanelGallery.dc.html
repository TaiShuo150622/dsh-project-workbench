<meta charset="utf-8">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.dsh{--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'PingFang SC','Microsoft YaHei';--ease:cubic-bezier(.4,0,.2,1)}
.dsh[data-theme="dark"]{--bg:#151517;--side:#1B1B1D;--l1:#232324;--l2:#2C2C2E;--l3:#353638;--t1:#F9FAFB;--t2:#CFD3D6;--t3:#ADB2B8;--t4:#81858C;--line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.06);--accent:#7AAAFF;--accent-bg:rgba(122,170,255,.16);--accent-btn:#7AAAFF;--on-accent:#0F1115;--ok:#22C55E;--warn:#F59E0B;--warn-t:#F7AD31;--err:#F25A5A;--c1:#4F8AF2;--c2:#0FA696;--c3:#A066F0;--c4:#DE4F92}
.dsh[data-theme="light"]{--bg:#FFFFFF;--side:#F5F6F7;--l1:#F5F6F7;--l2:#E9ECF2;--l3:#E1E5EE;--t1:#0F1115;--t2:#43454A;--t3:#61666B;--t4:#6B7076;--line:rgba(0,0,0,.12);--line-soft:rgba(0,0,0,.06);--accent:#4176E6;--accent-bg:rgba(65,118,230,.12);--accent-btn:#2F5FCC;--on-accent:#FFFFFF;--ok:#22C55E;--warn:#F59E0B;--warn-t:#A35F0A;--err:#EC1313;--c1:#2F5FCC;--c2:#008F7F;--c3:#8A4FD0;--c4:#C43E7E}
button,input{font-family:inherit}
.gl{flex:none;display:inline-block;width:14px;text-align:center;font-family:var(--mono)}
.tab{height:30px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:13px;line-height:20px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--l2);color:var(--t1)}
.chip{height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--t3);font-size:12px;line-height:18px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--l2);color:var(--t1)}
.ic{width:28px;height:28px;border:0;border-radius:6px;background:var(--l1);box-shadow:0 0 0 0.5px var(--line);color:var(--t1);font-size:14px;line-height:20px;cursor:pointer}
.btn{height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--l2);color:var(--t1);font-size:12px;line-height:18px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--l3)}
.pri{background:var(--accent-btn);color:var(--on-accent)}
.pri:hover{background:var(--accent-btn)}
.mk{position:absolute;display:flex;align-items:center;gap:4px;height:22px;margin:-11px 0 0 -7px;padding:0 6px 0 0;border:0;border-radius:6px;background:transparent;color:var(--t1);font-size:12px;line-height:16px;white-space:nowrap;cursor:pointer}
.mk:hover{background:var(--l1)}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:8px;font-size:12px;line-height:22px;color:var(--t2)}
.kv span:first-child{color:var(--t3)}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);font-size:13px;line-height:20px;color:var(--t2)}
.opt{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:12px;line-height:18px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--l3);color:var(--t1)}
.pulse{animation:pulse 1.2s var(--ease) 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-bg)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>

<div class="dsh" data-theme="{{theme}}" style="position: relative; width: 1440px; height: 944px; overflow: hidden; background: var(--bg); color: var(--t1); font-family: var(--sans)">
  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: flex">
    <main style="width: 420px; flex: none; box-sizing: border-box; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 22px; box-shadow: 0.5px 0 0 var(--line)">
      <div style="align-self: flex-end; max-width: 92%; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; background: var(--l1)">{{chat.ask}}</div>
      <p style="margin: 0; color: var(--t1)">{{chat.reply}}</p>
      <button type="button" class="btn" onClick="{{aiPoint}}" style="align-self: flex-start">{{chat.point}}</button>
      <div style="flex: 1"></div>
      <div style="box-sizing: border-box; min-height: 84px; padding: 10px 12px; border-radius: 16px; background: var(--l1); box-shadow: 0 0 0 0.5px var(--line); display: flex; flex-direction: column; gap: 6px; color: var(--t4)">
        <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{refs}}" as="r" hint-placeholder-count="2"><button type="button" class="btn" onClick="{{r.drop}}" style="height: 24px">{{r.t}} ×</button></sc-for></div>
        <span>继续这个会话</span>
      </div>
    </main>

    <section aria-label="面板" style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg)">
      <div style="height: 44px; flex: none; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 2px; box-shadow: 0 0.5px 0 var(--line); background: var(--side)">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" class="tab" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.name}}</button></sc-for>
        <span style="flex: 1"></span><span style="font-size: 12px; line-height: 18px; color: var(--t3); padding-right: 8px">{{meta.fam}} · {{meta.src}}</span>
      </div>
      <div style="height: 40px; flex: none; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px; box-shadow: 0 0.5px 0 var(--line-soft)">
        <strong style="font-size: 13px; line-height: 20px; font-weight: 600; padding: 0 6px; white-space: nowrap">{{meta.title}}</strong>
        <span style="width: 1px; height: 16px; background: var(--line); margin: 0 4px"></span>
        <sc-for list="{{layers}}" as="l" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{l.toggle}}" aria-pressed="{{l.on}}">{{l.name}}</button></sc-for>
        <span style="flex: 1"></span>
        <span style="display: {{timeShow}}; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--t3)"><label for="pg-time">恒星时</label><input id="pg-time" type="range" min="0" max="24" step="0.25" value="{{lst}}" onChange="{{setLst}}" style="width: 120px"></span>
      </div>

      <div style="flex: 1; min-height: 0; display: flex">
        <div role="application" aria-label="{{meta.title}}" style="position: relative; flex: 1; min-width: 0; overflow: hidden; cursor: grab; user-select: none" onMouseDown="{{down}}" onMouseMove="{{move}}" onMouseUp="{{up}}" onMouseLeave="{{up}}">
          <svg viewBox="0 0 744 788" width="744" height="788" aria-hidden="true" style="position: absolute; left: 0; top: 0">
            <path d="{{p.a.d}}" fill="{{p.a.f}}" stroke="{{p.a.s}}" stroke-width="{{p.a.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="{{p.b.d}}" fill="{{p.b.f}}" stroke="{{p.b.s}}" stroke-width="{{p.b.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="{{p.c.d}}" fill="{{p.c.f}}" stroke="{{p.c.s}}" stroke-width="{{p.c.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="{{p.d.d}}" fill="{{p.d.f}}" stroke="{{p.d.s}}" stroke-width="{{p.d.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="{{p.e.d}}" fill="{{p.e.f}}" stroke="{{p.e.s}}" stroke-width="{{p.e.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="{{p.g.d}}" fill="{{p.g.f}}" stroke="{{p.g.s}}" stroke-width="{{p.g.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <sc-for list="{{marks}}" as="m" hint-placeholder-count="8"><button type="button" class="mk {{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="left: {{m.x}}px; top: {{m.y}}px; opacity: {{m.op}}; box-shadow: {{m.ring}}"><span class="gl" style="color: {{m.c}}">{{m.g}}</span>{{m.t}}</button></sc-for>
          <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px"><button type="button" class="ic" onClick="{{zoomIn}}" aria-label="放大">+</button><button type="button" class="ic" onClick="{{zoomOut}}" aria-label="缩小">−</button><button type="button" class="ic" onClick="{{zoomFit}}" aria-label="装下全部">⤢</button></div>
          <div style="display: {{loadShow}}" class="ov"><span class="gl" style="color: var(--accent)">◐</span>框已经到了，数据还在取</div>
          <div style="display: {{emptyShow}}" class="ov"><span>这个范围没有数据</span><button type="button" class="btn" onClick="{{zoomFit}}">看全部</button></div>
          <div style="display: {{errShow}}" class="ov"><span><span class="gl" style="color: var(--err)">✕</span> 数据源连不上</span><button type="button" class="btn" onClick="{{stNormal}}">重试</button></div>
          <div style="display: {{staleShow}}; position: absolute; left: 12px; top: 12px; height: 28px; box-sizing: border-box; padding: 0 8px; align-items: center; gap: 8px; border-radius: 8px; background: var(--l1); box-shadow: 0 0 0 0.5px var(--line); font-size: 12px; line-height: 18px; color: var(--warn-t)"><span class="gl">▲</span>2 小时前的数据<button type="button" class="chip" onClick="{{stNormal}}" style="height: 22px">刷新</button></div>
        </div>

        <aside aria-label="检查器" style="width: 220px; flex: none; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--side); box-shadow: -0.5px 0 0 var(--line)">
          <strong style="font-size: 13px; line-height: 20px; font-weight: 600">{{ins.title}}</strong>
          <sc-for list="{{ins.rows}}" as="r" hint-placeholder-count="4"><div class="kv"><span>{{r.k}}</span><span>{{r.v}}</span></div></sc-for>
          <div style="flex: 1"></div>
          <button type="button" class="btn pri" onClick="{{addRef}}" style="display: {{refBtn}}">引用到对话</button>
        </aside>
      </div>

      <div style="height: 28px; flex: none; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--t3); box-shadow: 0 -0.5px 0 var(--line-soft)"><span>{{status}}</span><span style="flex: 1"></span><span>{{zText}}</span></div>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 4px; background: var(--side); box-shadow: 0 -0.5px 0 var(--line); font-size: 13px; line-height: 20px">
    <span style="color: var(--t3); padding-right: 8px">拖动画布，点标记看属性。所有类型同一外壳，五种状态也相同</span><span style="flex: 1"></span>
    <button type="button" class="opt" onClick="{{stNormal}}" aria-pressed="{{sN}}">正常</button><button type="button" class="opt" onClick="{{stLoad}}" aria-pressed="{{sL}}">加载</button><button type="button" class="opt" onClick="{{stEmpty}}" aria-pressed="{{sE}}">空</button><button type="button" class="opt" onClick="{{stErr}}" aria-pressed="{{sR}}">出错</button><button type="button" class="opt" onClick="{{stStale}}" aria-pressed="{{sS}}">过期</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":944}}'>
class Component extends DCLogic {
  W = 744; H = 788;
  state = { type: 'map', view: {}, sel: null, off: {}, refs: [], ai: [], st: 'normal', lst: 6, yaw: 0.7, pitch: 0.42, aiTick: 0 };
  meta = {
    map: { name: '地图', fam: '空间', src: 'sites.geojson', title: '站点分布', cx: 372, cy: 394 },
    sky: { name: '天体', fam: '空间', src: 'stars.csv', title: '北天星图', cx: 0, cy: 0 },

  stars = [['s0', '天枢', 11.06, 61.75], ['s1', '天璇', 11.03, 56.38], ['s2', '天玑', 11.9, 53.69], ['s3', '天权', 12.26, 57.03], ['s4', '玉衡', 12.9, 55.96], ['s5', '开阳', 13.4, 54.93], ['s6', '摇光', 13.79, 49.31], ['p', '勾陈一', 2.53, 89.26], ['c0', '王良一', 0.15, 59.15], ['c1', '王良四', 0.68, 56.54], ['c2', '策', 0.95, 60.72], ['c3', '阁道三', 1.43, 60.24], ['c4', '阁道二', 1.91, 63.67]];

  nodes = [['n0', 'Transformer', 372, 330, 0], ['n1', '注意力机制', 250, 420, 1], ['n2', '多头注意力', 372, 460, 1], ['n3', '缩放点积', 500, 500, 1], ['n4', '位置编码', 520, 300, 1], ['n5', 'Attention Is All You Need', 372, 170, 2], ['n6', 'BERT', 170, 240, 0], ['n7', 'GPT-2', 250, 130, 0], ['n8', 'DeepSeek-V3', 560, 150, 0], ['n9', 'mHC', 620, 260, 1], ['n10', 'Vaswani', 150, 110, 3], ['n11', '残差连接', 130, 400, 1], ['n12', 'LayerNorm', 240, 580, 1], ['n13', 'Adam', 520, 640, 1], ['n14', '困惑度', 120, 560, 3]];
  edges = [['n5', 'n0'], ['n0', 'n2'], ['n1', 'n2'], ['n2', 'n3'], ['n0', 'n4'], ['n0', 'n6'], ['n0', 'n7'], ['n0', 'n8'], ['n8', 'n9'], ['n5', 'n10'], ['n0', 'n11'], ['n11', 'n12'], ['n0', 'n12'], ['n3', 'n13'], ['n7', 'n14'], ['n1', 'n11'], ['n4', 'n9']];
  parts = { shell: '外壳', inner: '内胆', stand: '支架' };
  look = { ok: ['●', 'var(--ok)'], wait: ['▲', 'var(--warn)'], run: ['◐', 'var(--accent)'] };
  hash(a, b) { let h = (a * 73856093) ^ (b * 19349663); h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
  v() { const { type, view } = this.state, m = this.meta[type]; return view[type] || { z: 1, cx: m.cx, cy: m.cy }; }
  setV(patch) { this.setState((s) => ({ view: { ...s.view, [s.type]: { ...this.v(), ...patch } } })); }
  P(pts, close) { return pts.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join('') + (close ? 'Z' : ''); }
  coast(ox, oy, R, seed, n) { const out = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = R * (0.72 + (this.hash(i, seed) % 100) / 100 * 0.32); out.push([ox + Math.cos(a) * r, oy + Math.sin(a) * r * 1.18]); } return out; }

    for (let y = 40; y < 780; y += 100) grid += this.P([T(0, y), T(744, y)]);
    const roads = [[[240, 420], [300, 240], [520, 300], [560, 470], [410, 560], [240, 420]], [[380, 380], [520, 300]], [[380, 380], [410, 560]]].map((r) => this.P(r.map((q) => T(...q)))).join('');
    const river = this.P([[300, 140], [330, 260], [380, 380], [350, 500], [370, 640]].map((q) => T(...q)));
    const heat = this.P(this.coast(540, 380, 96, 11, 18).map((q) => T(...q)), true);
    return {
      a: { d: this.P(land, true) + this.P(isle, true), f: 'var(--l1)', s: 'var(--t4)', w: 1 }, b: on.grid ? { d: grid, f: 'none', s: 'var(--line)', w: 0.5 } : this.empty(),

  skyXY(ra, dec, lst) { const a = (ra - lst) / 12 * Math.PI, r = (90 - dec) * 8.4; return [Math.sin(a) * r, -Math.cos(a) * r]; }
  drawSky(T, on, lst) {
    let dots = '', big = '', grid = '';
    for (let i = 0; i < 220; i++) { const ra = (this.hash(i, 5) % 2400) / 100, dec = 42 + (this.hash(i, 9) % 4800) / 100, [x, y] = T(...this.skyXY(ra, dec, lst)); (i % 9 === 0 ? (big += `M${x.toFixed(1)} ${y.toFixed(1)}l0 0`) : (dots += `M${x.toFixed(1)} ${y.toFixed(1)}l0 0`)); }
    [80, 70, 60, 50].forEach((dec) => { const c = []; for (let i = 0; i <= 48; i++) c.push(T(...this.skyXY(i / 2, dec, 0))); grid += this.P(c); });
    for (let h = 0; h < 24; h += 3) grid += this.P([T(...this.skyXY(h, 90, lst)), T(...this.skyXY(h, 44, lst))]);
