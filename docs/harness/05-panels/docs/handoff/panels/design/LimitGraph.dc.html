.opt{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--t2);font-size:12px;line-height:18px;cursor:pointer;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--l3);color:var(--t1)}
