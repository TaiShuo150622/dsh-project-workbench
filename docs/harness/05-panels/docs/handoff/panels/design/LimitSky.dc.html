      const o = i * 7, A = a[o], e = a[o + 1], n = 6.2832 / Math.pow(A, 1.5), M = (a[o + 5] + n * this.T) % 6.2832, E = M + e * Math.sin(M), q = this.sq(this.orb(A, e, a[o + 2], a[o + 3], a[o + 4], E));
      const x = Math.round(W / 2 + q[0] * sc * 1.9), y = Math.round(H / 2 + q[2] * sc * 0.9);
      if (x >= 0 && x < W && y >= 0 && y < H) g[y][x]++;
    }
    const ramp = ' ·:+*#', rows = g.map((r) => r.map((v) => ramp[Math.min(5, v === 0 ? 0 : Math.ceil(Math.log2(v + 1)))]));
    const P = [['☉', [0, 0, 0]], ...this.planets.map((p) => [p[0][0], this.sq(this.kep(p, this.T))])];
    P.forEach(([c, q]) => { const x = Math.round(W / 2 + q[0] * sc * 1.9), y = Math.round(H / 2 + q[2] * sc * 0.9); if (x >= 0 && x < W && y >= 0 && y < H) { rows[y][x] = c; rows[y].splice(x + 1, 1); } });
    return rows.map((r) => ({ t: r.join(''), c: 'var(--t2)' }));
  }
  renderVals() {
    const { N, speed, log, sel, fps, ms, date, tui, rows, noGL, info } = this.state, name = (v) => (v >= 1e6 ? `${v / 1e6} 百万` : `${v / 1e4} 万`);
    const setN = (v) => () => { this.setState({ N: v }); if (this.gl) this.fill(v); };
    return {
      theme: this.props.theme ?? 'dark', fps, ms, date: date || '2026-11-01', count: N.toLocaleString('en-US'),
      glShow: tui ? 'none' : 'block', tuiShow: tui ? 'block' : 'none', failShow: noGL ? 'block' : 'none', tui: rows,
      ins: info || { name: '地球', rows: [{ k: '状态', v: '正在载入' }] },
      bodies: ['太阳', ...this.planets.map((p) => p[0])].map((n, i) => ({ i, name: n, fg: i === sel ? 'var(--accent)' : 'var(--t1)', pick: () => this.setState({ sel: i }) })),
      speeds: [[0, '暂停'], [0.1, '1 月/秒'], [1, '1 年/秒'], [12, '12 年/秒'], [60, '60 年/秒']].map(([v, t]) => ({ t, on: speed === v ? 'true' : 'false', pick: () => this.setState({ speed: v }) })),
      sizes: [100000, 500000, 1000000, 2000000, 5000000].map((v) => ({ t: name(v), on: N === v ? 'true' : 'false', pick: setN(v) })),
      toggleLog: () => { this.setState((s) => ({ log: !s.log }), () => { if (this.gl) this.orbits(); }); }, logOn: log ? 'true' : 'false',
      toggleTui: () => this.setState((s) => ({ tui: !s.tui })), tuiOn: tui ? 'true' : 'false'
    };
  }
}
